name: Web CI

on: [push, pull_request]

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/web

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uvx ruff check backend/ eval/

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for leaked secrets (NFR-SEC-1 / NFR-SEC-2)
        # Uses the repo's detect-secrets baseline (pre-commit hook equivalent in CI).
        run: |
          pip install detect-secrets==1.5.0
          detect-secrets scan --baseline .secrets.baseline > /tmp/secrets-report.json || true
          # Fail if anything outside the allowlisted baseline is found.
          git diff --no-index .secrets.baseline /tmp/secrets-report.json \
            && { echo "New secrets detected — see diff above"; exit 1; } \
            || echo "No new secrets detected."

  eval:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.EVAL_ENABLED == 'true'
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VERACITY_INTERNAL_TOKEN: ${{ secrets.VERACITY_INTERNAL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync
        working-directory: apps/web/backend
      - run: uv run python ../eval/harness.py --api-url ${{ secrets.API_URL }}
        working-directory: apps/web/backend
      - run: |
          git config user.name "CI Bot"
          git config user.email "bot@veracity.dev"
          git add eval/results/
          git commit -m "chore: add eval results [skip ci]" || true
          git push
