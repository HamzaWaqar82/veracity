name: Web CI

on: [push, pull_request]

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/web

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uvx ruff check backend/ eval/

  eval:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.EVAL_ENABLED == 'true'
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync
        working-directory: apps/web/backend
      - run: uv run python ../eval/harness.py --api-url ${{ secrets.API_URL }}
        working-directory: apps/web/backend
      - run: |
          git config user.name "CI Bot"
          git config user.email "bot@veracity.dev"
          git add eval/results/
          git commit -m "chore: add eval results [skip ci]" || true
          git push
