name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend/ eval/

  eval:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python eval/harness.py --api-url ${{ secrets.API_URL }}
      - run: |
          git config user.name "CI Bot"
          git config user.email "bot@fsms.dev"
          git add eval/results/
          git commit -m "chore: add eval results [skip ci]" || true
          git push
